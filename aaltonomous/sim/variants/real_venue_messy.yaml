# real_venue with the objects as they really lie (venue photos, handoffs/venue/; organisers: placement "may vary at
# random (prisms on a face or on a side)"): triangular prisms on a rectangular side (a ramp, ridge on top) and
# objects touching in a cluster. Schema: aalto_task/variant.py `layout:`, aalto_task/messy.py.
# Use: docker exec -e AALTO_VARIANT=real_venue_messy aalto-b bash -lc "aalto sim"
name: real_venue_messy
inherit: real_venue
notes: real_venue + half of the prisms lying on a side + a touching cluster in half of the episodes

layout:
  lying_prism_prob: 0.5      # GUESS: SEEN one lying prism in the venue photo; organisers: "on a face or on a side"
  cluster_prob: 0.5          # GUESS: SEEN a cluster of 4-5 touching blocks in the venue photo
  cluster_spacing: [1.05, 1.25]   # centre distance x object size: touching or nearly (footprints >= 1 mm apart)
  cluster_n: [2, 4]
