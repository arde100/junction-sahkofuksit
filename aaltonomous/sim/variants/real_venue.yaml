# The venue table as Aaro measured it on 2026-11-14 (roughly, in phone lengths and by eye):
#   - the box row is SQUARE to the robot; its near edge is 42.5 cm from the TABLE'S near edge;
#   - the robot's belly is ~1 cm from the table's near edge; from the URDF meshes the body's front surface near table
#     height is 0.06-0.07 m ahead of the waist joint, so the table edge is at ~0.075 m and the boxes' near edge at
#     ~0.50 m in the pelvis frame (+- 3 cm; the published plan says 0.40, data drop 2 looked like 0.47-0.62);
#   - box walls ~6.8 cm high; all blocks have 47 mm sides (measured twice; the second time accurately).
# From the venue photos (handoffs/venue/): bare plywood table, no mat; boxes 1-3 cm apart, AT THE TABLE'S FAR EDGE.
# Not measured: box width, table height.
# real_venue_near / real_venue_far = the same with the near edge at 0.47 / 0.53 (the measurement's uncertainty).
# Everything else as real_d2 (no mat, camera pitched 2.8 deg, thumb stops, real gains / wiring / colours).
# Use: docker exec -e AALTO_VARIANT=real_venue aalto-b bash -lc "aalto sim"
name: real_venue
inherit: real_d2
notes: venue measurement 2026-11-14 - boxes square, near edge 0.50 from the waist joint (0.425 from the table edge at 0.075), walls 0.068, objects 47 mm

boxes:
  front_x: 0.50      # 0.075 (table near edge: belly front 0.065 from the meshes + 1 cm gap, MEASURED) + 0.425 (MEASURED, +- 3 cm)
  yaw_deg: 0.0       # MEASURED: square to the robot
  gap: 0.02          # SEEN in the venue photos: the boxes stand 1-3 cm apart (published plan 0.05)
table:
  x: [0.075, 0.72]   # near edge MEASURED (see above); far edge SEEN in the photos: the boxes stand at the table's far
                     # edge (0.50 + 0.21 = 0.71): an object over a far wall is OFF the table

scene:
  bins: {wall_height: 0.068}    # MEASURED (0.4 phone lengths); published plan 0.06
  objects: {size: 0.047}        # MEASURED (Aaro, second and more accurate measurement): all blocks have 47 mm sides
                                # (scene.yaml 0.045). For the prism "side" may mean the triangle's side (altitude then
                                # 40.7 mm) rather than its altitude: not known; the sim's single size is the altitude.
